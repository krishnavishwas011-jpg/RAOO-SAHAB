        // DETERMINISTIC NUMBER
        function getBestNumber(dataList, isBig) {
            let counts = {};
            for(let i=0; i<Math.min(dataList.length, 20); i++){
                let num = parseInt(dataList[i].number);
                if (isBig && num >= 5) { counts[num] = (counts[num] || 0) + 1; }
                else if (!isBig && num < 5) { counts[num] = (counts[num] || 0) + 1; }
            }
            let bestNum = isBig ? 7 : 2; 
            let maxCount = -1;
            for(let key in counts) {
                if(counts[key] > maxCount) { maxCount = counts[key]; bestNum = parseInt(key); }
            }
            return bestNum;
        }

        // ZERO-RANDOMNESS ENHANCED PATTERN ENGINE
        function raoPremiumCalculation(dataList, targetPeriod) {
            let historyStr = "";
            let maxLen = Math.min(dataList.length, 100); 
            for (let i = maxLen - 1; i >= 0; i--) { historyStr += (dataList[i].number >= 5) ? 'B' : 'A'; }
            let total = historyStr.length;
            
            // Fallback determinism
            if(total < 3) return { isBig: (BigInt(targetPeriod) % 2n === 0n), conf: 85, no: 7 };

            let countA = historyStr.split('A').length - 1; let countB = historyStr.split('B').length - 1;
            let freqA = countA / total; let freqB = countB / total;

            let streak = 1;
            for (let i = total - 1; i > 0; i--) { if (historyStr.charAt(i) === historyStr.charAt(i - 1)) streak++; else break; }
            let lastChar = historyStr.charAt(total - 1);
            let streakA = 0, streakB = 0;
            if (streak >= 3) { if (lastChar === 'A') streakA = 1.0; else streakB = 1.0; }

            let aToB = 0, aToA = 0, bToA = 0, bToB = 0;
            for (let i = 0; i < total - 1; i++) {
                let curr = historyStr.charAt(i); let next = historyStr.charAt(i + 1);
                if (curr === 'A' && next === 'B') aToB++; if (curr === 'A' && next === 'A') aToA++;
                if (curr === 'B' && next === 'A') bToA++; if (curr === 'B' && next === 'B') bToB++;
            }
            let transA = 0, transB = 0;
            if (lastChar === 'A') { transA = (aToA >= aToB) ? 1.0 : 0; transB = (aToB > aToA) ? 1.0 : 0; }
            if (lastChar === 'B') { transA = (bToA >= bToB) ? 1.0 : 0; transB = (bToB > bToA) ? 1.0 : 0; }

            let altBreakA = 0, altBreakB = 0; let last4 = historyStr.slice(-4); let last3 = historyStr.slice(-3);
            if (last3 === "ABA") altBreakA = 1.0; else if (last3 === "BAB") altBreakB = 1.0; 

            let finalA = (freqA * 0.30) + (streakA * 0.25) + (transA * 0.25) + (altBreakA * 0.20);
            let finalB = (freqB * 0.30) + (streakB * 0.25) + (transB * 0.25) + (altBreakB * 0.20);

            // HARD OVERRIDES (Reduces Losses)
            if (last4 === "BBBB") finalB += 2.0; // Follow the Dragon
            if (last4 === "AAAA") finalA += 2.0; // Follow the Dragon
            if (last4 === "AABB") finalA += 1.5; // Double Pair Mirror

            let isBig = false;
            if (finalB > finalA) isBig = true;
            else if (finalA === finalB) isBig = (BigInt(targetPeriod) % 2n === 0n); // 100% Deterministic Tie-breaker

            // Confidence calculation based on score difference
            let diff = Math.abs(finalB - finalA);
            let conf = 80 + Math.floor(diff * 10);
            if(conf > 99) conf = 99;

            let suggestedNo = getBestNumber(dataList, isBig);
            return { isBig: isBig, conf: conf, no: suggestedNo };
        }

        // ZERO-RANDOMNESS AI PRO
        function aiProCalculation(dataList, targetPeriod) {
            let seq = dataList.slice(0, 1000).map(x => x.number >= 5 ? 'B' : 'S').reverse().join('');
            if(seq.length < 5) return { isBig: (BigInt(targetPeriod) % 2n === 0n), conf: 85, no: 5 };
            
            let recent3 = seq.slice(-3); let countNextB = 0; let countNextS = 0;
            for(let i = 0; i < seq.length - 3; i++) {
                if(seq.substring(i, i+3) === recent3) { if(seq.charAt(i+3) === 'B') countNextB++; else countNextS++; }
            }
            
            let isBig;
            if(countNextB > countNextS) isBig = true;
            else if(countNextS > countNextB) isBig = false;
            else isBig = (BigInt(targetPeriod) % 2n === 0n); // Deterministic fallback
            
            let conf = 85 + (Math.abs(countNextB - countNextS) > 2 ? 10 : 0); 
            if(conf > 99) conf = 99;
            let suggestedNo = getBestNumber(dataList, isBig);
            return { isBig: isBig, conf: conf, no: suggestedNo };
        }

        async function fetchApi() {
            try {
                let res = await fetch(apiUrl); let json = await res.json();
                if(json && json.data && json.data.list) return json.data.list;
            } catch (e) {}
            return null;
        }

        async function botLogicTick() {
            if (!isActive || isFetching) return;
            isFetching = true; 
            let data = await fetchApi();
            if (!data) { isFetching = false; return; }

            let latestPeriod = data[0].issueNumber; let latestNumber = data[0].number; let latestIsBig = latestNumber >= 5;

            if (lastProcessedPeriod !== "" && latestPeriod !== lastProcessedPeriod) {
                lastProcessedPeriod = latestPeriod;

                if (pendingPrediction !== null && pendingPrediction.period === latestPeriod) {
                    if (pendingPrediction.isBig === latestIsBig) {
                        wins++; updateStats();
                        addLog(`WON Period ${latestPeriod} (No: ${latestNumber})`, "win");
                        
                        await sendTgSticker(winFirstSticker);
                        let midSticker = getDeterministicSticker(winMiddleStickers, latestPeriod + "1");
                        await sendTgSticker(midSticker);
                        let lastSticker = getDeterministicSticker(winLastStickers, latestPeriod + "2");
                        await sendTgSticker(lastSticker);
                    } else {
                        losses++; updateStats();
                        addLog(`LOST Period ${latestPeriod} (No: ${latestNumber})`, "loss");
                        
                        let lossSticker = getDeterministicSticker(lossStickers, latestPeriod);
                        await sendTgSticker(lossSticker);
                    }
                }

                let nextPeriod = (BigInt(latestPeriod) + 1n).toString();
                let resultObj = (currentServer === 'PREMIUM') ? raoPremiumCalculation(data, nextPeriod) : aiProCalculation(data, nextPeriod);
                pendingPrediction = { period: nextPeriod, isBig: resultObj.isBig };
                
                let typeStr = resultObj.isBig ? "BIG" : "SMALL";
                let uiColorCode = resultObj.isBig ? "#ff3366" : "#00ffaa";
                
                let colorText = "";
                if(document.getElementById('colorToggle').checked) {
                    let color = (resultObj.no % 2 === 0) ? "🔴 Red" : "🟢 Green";
                    if(resultObj.no === 0 || resultObj.no === 5) color = "🟣 Violet + " + (resultObj.no === 0 ? "🔴 Red" : "🟢 Green");
                    colorText = `\n🌈 Color: ${color}`;
                }

                updateLiveUI(nextPeriod, typeStr, uiColorCode);

                let vipMsg = `💠 <b>RAO SAHAB VIP SIGNAL</b> 💠\n\n🎯 Game: Wingo 30 sec \n🆔 Period: <b>${nextPeriod}</b>\n\n🔥 Prediction: <b>${typeStr}</b> ${colorText}\n📊 Confidence: ${resultObj.conf}%\n👑 Rao suggested no: ${resultObj.no} \n💎 Powered By: RAO SAHAB SYSTEM`;
                await sendTgMessage(vipMsg);
                addLog(`Signal Sent for ${nextPeriod}: ${typeStr}`);
            } else if (lastProcessedPeriod === "") {
                lastProcessedPeriod = latestPeriod;
                addLog("Synced with Server. Ready for next cycle...");
            }
            isFetching = false;
        }

        // --- RETROACTIVE HISTORY (WIN/LOSS TRACKING) ---
        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            const ballsContainer = document.getElementById('historyBalls');
            
            container.innerHTML = '<p style="text-align:center; color:#00e5ff;">Running Pattern Calculations...</p>';
            ballsContainer.innerHTML = '';

            let data = await fetchApi();
            if(data) {
                container.innerHTML = '';
                
                for(let i=0; i<Math.min(data.length, 15); i++) {
                    let d = data[i];
                    let isBig = d.number >= 5;
                    let ballClass = isBig ? "ball-red" : "ball-green";
                    ballsContainer.innerHTML += `<div class="ball ${ballClass}">${d.number}</div>`;
                }

                // Retroactive Calculation Loop
                for(let i=0; i<Math.min(data.length - 1, 15); i++) {
                    let actualData = data[i];
                    let pastDataForCalculation = data.slice(i + 1); // Only data available BEFORE this period
                    let targetPeriod = actualData.issueNumber;
                    
                    // Run the bot's logic on past data
                    let botResult = (currentServer === 'PREMIUM') ? raoPremiumCalculation(pastDataForCalculation, targetPeriod) : aiProCalculation(pastDataForCalculation, targetPeriod);
                    
                    let actualIsBig = actualData.number >= 5;
                    let botIsBig = botResult.isBig;
                    let isWin = (actualIsBig === botIsBig);
                    
                    let t = actualIsBig ? '<span style="color:#ff3366; font-weight:bold;">🔴 BIG</span>' : '<span style="color:#00ffaa; font-weight:bold;">🟢 SMALL</span>';
                    
                    let badge = isWin ? '<span class="badge badge-win">✅ WIN</span>' : '<span class="badge badge-loss">❌ LOSS</span>';
                    let botPredText = botIsBig ? "BIG" : "SMALL";
                    
                    container.innerHTML += `
                    <div class="history-item" style="flex-direction:column; align-items:flex-start;">
                        <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                            <span><b>${actualData.issueNumber}</b></span>
                            ${badge}
                        </div>
                        <div style="display:flex; justify-content:space-between; width:100%; color:#88ddff; font-size:12px;">
                            <span>Bot Said: <b>${botPredText}</b></span>
                            <span>Result: ${actualData.number} | ${t}</span>
                        </div>
                    </div>`;
                }
            }
        }
    </script>
